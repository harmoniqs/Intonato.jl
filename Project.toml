name = "Intonato"
uuid = "4c8581c7-0eaf-45eb-b8fa-a3474c50779c"
version = "0.4.1"
authors = ["Nguyen and contributors"]

[deps]
Distributions = "31c24e10-a181-5473-b8eb-7969acd0382f"  # Intonato.Twins: OU Gaussian noise
GenericSchur = "c145ed77-6b09-5dd9-b285-bf645a82121e"  # transitive pin only: 0.5.7 breaks eigen! (RalphAS/GenericSchur.jl#24)
ForwardDiff = "f6369f11-7733-5829-9624-2563aa707210"
LinearAlgebra = "37e2e46d-f89d-539d-b4ee-838fcccc9c8e"
NamedTrajectories = "538bc3a1-5ab9-4fc3-b776-35ca1e893e08"
Piccolo = "c4671d76-df94-11ed-2057-43d4fd632fad"
Random = "9a3f8284-a2c9-5f02-9a11-845980a1fd5c"
Reexport = "189a3867-3050-52da-a836-e630ba90ab69"
SpecialFunctions = "276daf66-3868-5448-9aa4-cd146d93841b"
StableRNGs = "860ef19b-820b-49d6-a774-d7a799459cd3"  # Intonato.Twins: seeded, replayable rng
TestItemRunner = "f8b46487-2199-4994-9208-9a1283c18c0a"
TestItems = "1c621080-faea-4a02-84b6-bbd5e436b8fe"
YAML = "ddb6d928-2868-570f-bddf-ab3f9cf99eb6"  # Intonato.Twins: twin-record frontmatter

[weakdeps]
Optim = "429524aa-4258-5aef-a3af-852621145aeb"

[extensions]
IntonatoOptimExt = "Optim"

[compat]
Distributions = "0.25"  # Intonato.Twins: OU Gaussian noise
GenericSchur = "0.5.0 - 0.5.6"  # 0.5.7 piracy regression (RalphAS/GenericSchur.jl#24); drop when fixed
ForwardDiff = "1.3"
LinearAlgebra = "1.11"
NamedTrajectories = "0.8, 0.9"
Piccolo = "1.15, 2.0"
Random = "1.11"
Reexport = "1.2"
SpecialFunctions = "2.7"
StableRNGs = "1"
TestItemRunner = "1.1"
TestItems = "1.0"
YAML = "0.4"
julia = "1.12"

[extras]
FiniteDiff = "6a86dc24-6348-571c-b903-95158fe2bd41"
Optim = "429524aa-4258-5aef-a3af-852621145aeb"
# Pkg: the ownership-guard testitem reads the resolved manifest (Pkg.dependencies)
# to pin that no retired substrate package rides the resolution. Stdlib, but the
# Pkg.test sandbox does not put @stdlib on the testitems' load path — it must
# ride the test target.
Pkg = "44cfe95a-1eb2-52ea-b672-e2afdf69b78f"
Statistics = "10745b16-79ce-11e8-11f9-7d13ad32a3b2"  # Intonato.Twins tests: stationary statistics
Test = "8dfed614-e22c-5e08-85e1-65c5234f0b40"

[targets]
test = ["Test", "FiniteDiff", "Pkg", "Statistics"]
